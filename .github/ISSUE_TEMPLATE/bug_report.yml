name: Bug report
description: Report something that isn't working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug. Clear reports get fixed faster.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
      placeholder: When I run `python app.py` with query X, the agent ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps so we can see it too.
      placeholder: |
        1. Set query to '...'
        2. Run '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / traceback
      description: Paste any error output. This is automatically formatted as code.
      render: shell
  - type: input
    id: version
    attributes:
      label: Environment
      description: OS, Python version, and LLM provider.
      placeholder: "Windows 11, Python 3.11, Anthropic"
    validations:
      required: true
