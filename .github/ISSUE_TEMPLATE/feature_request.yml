name: Feature request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The motivation. "As a user, I want ... so that ..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like to happen. Sketch the approach if you have one.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why you set them aside.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Agent graph / routing
        - LLM integration
        - Tools / job search
        - UI (Streamlit)
        - Evaluation / observability
        - Docs / DX
        - Other
    validations:
      required: true
